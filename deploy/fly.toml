# Fly.io config for the Derive API container. Deploy with:
#   fly deploy --config deploy/fly.toml --dockerfile deploy/Dockerfile --app <your-app>
#
# `--app` overrides the placeholder below, so ONE config serves every instance: your own
# self-host, and a throwaway preview. Verified end to end on Fly with SQLite + a volume.
# Self-hosting your own instance? Change `app` to yours (or run `fly launch`,
# which rewrites it) and make the volume name below match yours.
app = "your-derive-app" # must be globally unique — `fly launch` picks one for you
primary_region = "iad"

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # 0 = scale to zero: the machine STOPS when idle and starts again on the next request, so an
  # instance nobody is using costs nothing. The trade is a cold start (a few seconds) on the
  # first request after idle. Set 1 if you would rather pay to keep it warm — that is the right
  # choice for anything with real users, and the wrong one for a preview or a personal instance.
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    # Readiness, not liveness: also verifies the DB + blob backend are reachable,
    # so traffic isn't routed to an instance whose backend is down.
    path = "/readyz"
    interval = "15s"
    timeout = "2s"

# With DATABASE_URL + OBJECT_STORE_URL set, the container is stateless — scale it
# horizontally and drop this volume. Without them, it falls back to SQLite + local
# blobs and needs one persistent volume mounted at /data.
[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
