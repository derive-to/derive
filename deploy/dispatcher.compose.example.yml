# The managed executor, self-contained: the dispatcher draining managed contexts
# on a cadence. Copy, fill in the env, and:
#
#   docker build -f deploy/runner.Dockerfile -t derive-runner .
#   docker build -f deploy/dispatcher.Dockerfile -t derive-dispatcher .
#   docker compose -f deploy/dispatcher.compose.example.yml up -d
#
# This is one of the interchangeable executor recipes from the built-in agent
# plan — the same `derive runner once` runs under a GitHub Actions cron or a
# plain compose-interval timer. No database: the schedule is an in-process clock,
# one drain per context at a time, and the next tick is the retry (a drain reads
# the whole queue every time, so a missed tick costs latency, never work).
services:
  dispatcher:
    image: derive-dispatcher
    restart: unless-stopped
    environment:
      # Which Derive to drain against; the cloud by default.
      DERIVE_SERVER: https://derive.to
      # The registry: which contexts this executor serves. Tokens by env name,
      # never inline — pair each token_env with a real env entry below.
      DISPATCHER_CONTEXTS: >-
        [{"id":"ctx_REPLACE_ME","token_env":"CTX_A_TOKEN"}]
      CTX_A_TOKEN: dk_agt_REPLACE_ME
      # The model credential, exactly one (same contract as the runner image):
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      # Per-context working dirs persist across drains AND restarts: repo
      # clones and materialized skills survive, so a per-minute cadence stays
      # cheap.
      - dispatcher-data:/data

volumes:
  dispatcher-data:
