# One runner service per agent whose machine is `owner`. Copy, rename per agent, and fill in:
#
#   docker compose -f runner.compose.example.yml up -d analytics
#
# The env file carries the secrets (never in this file, never in the image):
#   DERIVE_TOKEN=dk_agt_…          the agent's key
#   ANTHROPIC_API_KEY=sk-ant-…     the model (API billing) — or instead:
#   CLAUDE_CODE_OAUTH_TOKEN=…      `claude setup-token` (bills the subscription)
#   GH_TOKEN=ghp_…                 private repo pointers + gh (optional)
#   …plus whatever the agent's tools expect
services:
  analytics:
    build:
      context: ..
      dockerfile: deploy/runner.Dockerfile
    restart: unless-stopped
    environment:
      DERIVE_AGENT: ag_change_me
      # RUNNER_MODEL: sonnet
      # RUNNER_TIMEOUT_MS: "600000"
    env_file:
      - ./analytics.env
    command: ["serve"]
    volumes:
      # The agent's working directory: files it keeps between jobs.
      - /srv/agents/analytics:/work
      # Package caches outlive container recreation: MCP servers spawn via
      # npx/uvx per answer, and a cold fetch on a small box loses the race
      # against the MCP connect timeout.
      - npm-cache-analytics:/home/runner/.npm
      - uv-cache-analytics:/home/runner/.cache/uv

volumes:
  npm-cache-analytics:
  uv-cache-analytics:
