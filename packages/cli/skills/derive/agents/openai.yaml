interface:
  display_name: "Derive"
  short_description: "Publish, review, and revise work in Derive"
  brand_color: "#6B46FF"
  default_prompt: "Use $derive to publish this work and run the human review loop."

dependencies:
  tools:
    - type: "mcp"
      value: "derive"
      description: "Derive remote MCP for artifacts, comments, review, and workspace tools"
      transport: "streamable_http"
      url: "https://derive.to/mcp"

policy:
  allow_implicit_invocation: true
