name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The use case or pain point, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and success signal
      description: How does this problem show up today, and what observable outcome would show that it is solved?
  - type: textarea
    id: maintenance
    attributes:
      label: Maintenance and compatibility
      description: Note any new dependency, protocol, migration, security boundary, or ongoing operating cost.
