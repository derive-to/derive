name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: How are you running Dock?
      options:
        - Local dev (pnpm dev)
        - Self-host (SQLite + local disk)
        - Self-host (Postgres + S3/R2)
        - Hosted
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD` or the release tag.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
