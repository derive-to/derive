name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Ubicloud runners (cheaper than GitHub-hosted). Bump the suffix (-4, -8) for
    # more cores; falls back to a label your org's Ubicloud integration provides.
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + format (biome)
        run: pnpm run ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Runs the SAME apps/api suite against a real Postgres (ephemeral Docker
  # container, via scripts/test-pg.sh) so the hosted-tier driver is covered by
  # the full behavioral suite, not just typecheck + parity guards.
  pg:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test against Postgres
        run: pnpm test:pg
