name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Ubicloud runners (cheaper than GitHub-hosted). Bump the suffix (-4, -8) for
    # more cores; falls back to a label your org's Ubicloud integration provides.
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24] # the engines floor + the next major
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + format + guardrails (biome + custom checks)
        run: pnpm run ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Runs the SAME apps/api suite against a real Postgres (ephemeral Docker
  # container, via scripts/test-pg.sh) so the hosted-tier driver is covered by
  # the full behavioral suite, not just typecheck + parity guards.
  pg:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test against Postgres
        run: pnpm test:pg

  # Coverage gates (ratchet floors; see each package's vitest.config.ts): the API
  # suite and the data layer (@dock/db repos + sqlite driver).
  coverage:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API coverage
        run: pnpm --filter @dock/api test:coverage
      - name: DB coverage
        run: pnpm --filter @dock/db test:coverage

  # Bundle budget: build the web client and fail if the gzipped JS blows past the
  # budget (see scripts/check-bundle.mjs), so phosphor / radix / cmdk weight can't
  # regress silently.
  bundle:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web client
        run: pnpm --filter @dock/web build
      - name: Bundle budget
        run: pnpm lint:bundle

  # Supply-chain: a known-vulnerable production dependency, or a committed secret,
  # fails the build. Reads the lockfile + working tree, so no install is needed.
  security:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact --no-banner
