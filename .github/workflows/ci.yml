name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Ubicloud runners (cheaper than GitHub-hosted). Bump the suffix (-4, -8) for
    # more cores; falls back to a label your org's Ubicloud integration provides.
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        node: [24] # the engines floor (Node 24 LTS — the sole supported runtime)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + format + guardrails (biome + custom checks)
        run: pnpm run ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Runs the SAME apps/api suite against a real Postgres (ephemeral Docker
  # container, via scripts/test-pg.sh) so the hosted-tier driver is covered by
  # the full behavioral suite, not just typecheck + parity guards.
  pg:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test against Postgres
        run: pnpm test:pg

  # Runs the SAME @derive/db store contract against a real Cloudflare D1, inside
  # workerd via Miniflare (the `pnpm test:d1` lane). The default (Node) lane can't
  # host the D1 driver, so this is the only place src/d1.ts is exercised at runtime —
  # the edge tier runs on it.
  d1:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test against Cloudflare D1 (workerd)
        run: pnpm --filter @derive/db test:d1

  # Coverage gates (ratchet floors; see each package's vitest.config.ts): the API
  # suite, the data layer (@derive/db), the shared domain logic (@derive/core), the blob
  # stores (@derive/storage), the MCP client, and the web app's pure logic (@derive/web;
  # its user flows are covered separately by the Playwright e2e suite).
  coverage:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API coverage
        run: pnpm --filter @derive/api test:coverage
      - name: DB coverage
        run: pnpm --filter @derive/db test:coverage
      - name: Core coverage
        run: pnpm --filter @derive/core test:coverage
      - name: Storage coverage
        run: pnpm --filter @derive/storage test:coverage
      - name: MCP coverage
        run: pnpm --filter @derive/mcp test:coverage
      - name: Web coverage
        run: pnpm --filter @derive/web test:coverage

  # Bundle budget: build the web client and fail if the gzipped JS blows past the
  # budget (see scripts/check-bundle.mjs), so phosphor / radix / cmdk weight can't
  # regress silently.
  bundle:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web client
        run: pnpm --filter @derive/web build
      - name: Bundle budget
        run: pnpm lint:bundle

  # Supply-chain: a known-vulnerable production dependency, or a committed secret,
  # fails the build. Reads the lockfile + working tree, so no install is needed.
  security:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact --no-banner

  # Ship on merge: deploy to Cloudflare (the Derive account) only on a push to main
  # AND only after every check above is green. Runs the exact same `pnpm run deploy`
  # a human runs by hand — build:web → apply D1 app schema → reconcile Better Auth
  # schema → apply Postgres schema → wrangler deploy → trigger the post-deploy smoke.
  # The schema steps are idempotent, so the datastore is brought fully current before
  # the new Worker goes live and a deploy can never ship code against a stale schema.
  # NB: the hosted tier runs on Postgres (Hyperdrive), so DATABASE_URL must be set or
  # deploy:pg-schema silently skips and the pg schema drifts from the deployed Worker.
  # PRs skip this job (the `if`), so nothing deploys until it's merged.
  deploy:
    needs: [check, pg, d1, coverage, bundle, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubicloud-standard-2
    # Never run two production deploys at once; let an in-flight deploy finish rather
    # than cancelling it mid-migration.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      actions: write # deploy:smoke triggers e2e-smoke.yml via the gh CLI
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy to Cloudflare
        # `run deploy` (not `pnpm deploy`, which pnpm intercepts as its own subcommand).
        run: pnpm --filter @derive/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Neon connection string for deploy:pg-schema (the hosted tier's metadata +
          # auth store). Without it the pg schema step no-ops and can drift.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
