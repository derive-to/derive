name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Ubicloud runners (cheaper than GitHub-hosted). Bump the suffix (-4, -8) for
    # more cores; falls back to a label your org's Ubicloud integration provides.
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + format (biome)
        run: pnpm run ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @dock/web exec playwright install --with-deps chromium

      - name: e2e smoke (publish, comment, resolve)
        run: pnpm --filter @dock/web test:e2e
