name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Ubicloud runners (cheaper than GitHub-hosted). Bump the suffix (-4, -8) for
    # more cores; falls back to a label your org's Ubicloud integration provides.
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + format + guardrails (biome + custom checks)
        run: pnpm run ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Runs the SAME apps/api suite against a real Postgres (ephemeral Docker
  # container, via scripts/test-pg.sh) so the hosted-tier driver is covered by
  # the full behavioral suite, not just typecheck + parity guards.
  pg:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test against Postgres
        run: pnpm test:pg

  # Supply-chain: a known-vulnerable production dependency, or a committed secret,
  # fails the build. Reads the lockfile + working tree, so no install is needed.
  security:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact --no-banner
