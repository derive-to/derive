name: e2e deep (nightly)

# The comprehensive regression suite: every surface in depth (comment system,
# review flow, settings tabs, share roles, library search/favorites/collections)
# plus a responsive/mobile pass. Heavier than smoke.
#
# Manual-only (workflow_dispatch) for now. It inherits the reliability fixes from
# playwright.config.ts (workers=1 on CI, prebuilt SPA, 15s timeout) — previously it
# silently inherited the old CI=4 default and oversubscribed the 2-vCPU box worse
# than smoke did. At workers=1 the 64-spec suite runs serially (slow); add a
# `schedule:` + `--shard` (blob reporter + merge-reports) once smoke is proven green
# and the realtime SSE-tick specs are confirmed stable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm --filter @derive/web exec playwright install --with-deps chromium

      - name: Deep suite
        run: pnpm --filter @derive/web test:e2e:deep

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-deep
          path: apps/web/playwright-report
          retention-days: 14
