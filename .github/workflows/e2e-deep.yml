name: e2e deep (nightly)

# The comprehensive regression suite: every surface in depth (comment system,
# review flow, settings tabs, share roles, library search/favorites/collections)
# plus a responsive/mobile pass. Heavier than smoke; intended to run NIGHTLY.
#
# Runs nightly (and on demand). Heavier than smoke, so it's a scheduled
# regression sweep rather than a per-PR gate.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @dock/web exec playwright install --with-deps chromium

      - name: Deep suite
        run: pnpm --filter @dock/web test:e2e:deep

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-deep
          path: apps/web/playwright-report
          retention-days: 14
