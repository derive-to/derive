name: e2e deep (nightly)

# The comprehensive regression suite: every surface in depth (comment system,
# review flow, settings tabs, share roles, library search/favorites/collections)
# plus a responsive/mobile pass. Heavier than smoke; intended to run NIGHTLY.
#
# DISABLED on CI for now (no automatic trigger — manual only via
# workflow_dispatch). Re-add `schedule:` once it's worth the nightly runner time.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @derive/web exec playwright install --with-deps chromium

      - name: Deep suite
        run: pnpm --filter @derive/web test:e2e:deep

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-deep
          path: apps/web/playwright-report
          retention-days: 14
