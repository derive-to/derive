name: e2e render fidelity

# Pins what the artifact sandbox's serve-time CSP (apps/api/src/lib/http.ts's
# RAW_HEADERS) actually permits — a self-contained artifact, a cdnjs-dependent one
# (a real Chart.js load from cdnjs.cloudflare.com), and a multi-page bundle — against
# real fixture content (apps/web/e2e/render-fidelity/fixtures/). Without this, a
# future hardening pass (e.g. adding a script-src/connect-src directive; today's
# `sandbox` CSP has none) would silently break every CDN-dependent artifact (a
# Claude/ChatGPT export that pulls a library) with nothing catching it.
#
# Scoped to the files that could actually regress this, not every PR: it makes a
# real network request to cdnjs.cloudflare.com, so it's slower and has one more
# external dependency than the smoke suite — worth avoiding on unrelated changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/e2e-fidelity.yml"
      - "apps/api/src/lib/http.ts"
      - "apps/api/src/lib/serve-content.ts"
      - "apps/api/src/routes/raw.ts"
      - "apps/api/src/routes/blob.ts"
      - "packages/core/src/md.ts"
      - "packages/core/src/mermaid.ts"
      - "apps/api/src/node.ts"
      - "apps/api/src/worker.ts"
      - "apps/api/scripts/prep-edge-assets.mjs"
      - "apps/api/package.json"
      - "apps/web/e2e/render-fidelity/**"
      - "apps/web/playwright.config.ts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  render-fidelity:
    runs-on: ubuntu-latest # free for a public repo; not on the gate's critical path
    # The suite takes a few minutes; a run once sat for 2h40m before GitHub's 6h
    # cap would have ended it. Fail fast instead of holding the PR's checks open.
    timeout-minutes: 15
    services:
      # Signup enqueues a verification email while the auth transaction is open.
      # The outbox uses a separate connection, so SQLite can lock during setup.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: derive_fidelity
          POSTGRES_USER: derive_fidelity
          POSTGRES_PASSWORD: derive_fidelity
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U derive_fidelity -d derive_fidelity"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm --filter @derive/web exec playwright install --with-deps chromium

      - name: Render fidelity suite
        env:
          DATABASE_URL: postgres://derive_fidelity:derive_fidelity@127.0.0.1:${{ job.services.postgres.ports[5432] }}/derive_fidelity
          DERIVE_DEFAULT_ORG_ID: ws_render_fidelity
        run: |
          export DERIVE_AUTH_SECRET="$(openssl rand -hex 32)"
          pnpm --filter @derive/web test:e2e:fidelity

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-fidelity
          path: apps/web/playwright-report
          retention-days: 7
