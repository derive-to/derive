name: e2e render fidelity

# Pins what the artifact sandbox's serve-time CSP (apps/api/src/lib/http.ts's
# RAW_HEADERS) actually permits — a self-contained artifact, a cdnjs-dependent one
# (a real Chart.js load from cdnjs.cloudflare.com), and a multi-page bundle — against
# real fixture content (apps/web/e2e/render-fidelity/fixtures/). Without this, a
# future hardening pass (e.g. adding a script-src/connect-src directive; today's
# `sandbox` CSP has none) would silently break every CDN-dependent artifact (a
# Claude/ChatGPT export that pulls a library) with nothing catching it.
#
# Scoped to the files that could actually regress this, not every PR: it makes a
# real network request to cdnjs.cloudflare.com, so it's slower and has one more
# external dependency than the smoke suite — worth avoiding on unrelated changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/src/lib/http.ts"
      - "apps/api/src/lib/serve-content.ts"
      - "apps/api/src/routes/raw.ts"
      - "apps/api/src/routes/blob.ts"
      - "apps/web/e2e/render-fidelity/**"
      - "apps/web/playwright.config.ts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  render-fidelity:
    runs-on: ubicloud-standard-4-arm # see ci.yml for the runner rationale
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm --filter @derive/web exec playwright install --with-deps chromium

      - name: Render fidelity suite
        run: pnpm --filter @derive/web test:e2e:fidelity

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-fidelity
          path: apps/web/playwright-report
          retention-days: 7
