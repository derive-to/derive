name: e2e smoke

# The fast critical-path suite: one happy path per surface (sign up, publish →
# comment → resolve, library, share, settings, theme, review). Runs on PRs.
#
# Previously disabled for CPU-contention flakes on the 2-vCPU runner. The
# reliability fixes now live in playwright.config.ts: workers=1 on CI (each
# multi-context spec already opens two browser contexts), a prebuilt SPA served by
# `vite preview` instead of the on-demand dev server (deterministic first paint),
# expect.timeout 15s, retries=2. If it proves flaky here, tighten there — don't
# just bump workers.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm --filter @derive/web exec playwright install --with-deps chromium

      - name: Smoke suite
        run: pnpm --filter @derive/web test:e2e:smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-smoke
          path: apps/web/playwright-report
          retention-days: 7
