name: repository-health

on:
  schedule:
    - cron: "17 6 * * *" # public settings can drift independently of a commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-surface:
    if: github.repository == 'derive-to/derive'
    runs-on: ubicloud-standard-4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public repository, security, and main-ruleset settings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-repository-health.mjs
