name: Publish CLI

# Publishes @derive-to/cli to npm when main carries a version npm does not have yet. Bump
# `version` in packages/cli/package.json in the PR; merging it publishes. Authentication is
# npm trusted publishing (OIDC from this workflow), so no npm token is stored anywhere, and
# every release carries a provenance attestation tying it to this commit.
#
# A Derive machine runs the CLI version pinned in apps/api/src/lib/runtime-setup.ts and
# DERIVE_ORTAM_RUNNER_PATH; publishing does not move that pin. Move it in a separate PR once
# the release is on npm.

on:
  push:
    branches: [main]
    paths: ["packages/cli/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'derive-to/derive'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Is this version already on npm?
        id: version
        working-directory: packages/cli
        run: |
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if npm view --prefer-online "@derive-to/cli@$version" version >/dev/null 2>&1; then
            echo "@derive-to/cli@$version is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test the CLI
        if: steps.version.outputs.publish == 'true'
        run: pnpm --filter @derive-to/cli test

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Use an npm that supports trusted publishing
        if: steps.version.outputs.publish == 'true'
        run: |
          if ! npx -y semver@7.7.2 -r ">=11.5.1" "$(npm --version)" >/dev/null; then
            npm install -g npm@11.6.2
          fi
          npm --version

      # pnpm pack, then publish the tarball: pack is what turns workspace: ranges into versions.
      - name: Pack
        id: pack
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/cli
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          echo "tarball=$RUNNER_TEMP/derive-to-cli-${{ steps.version.outputs.value }}.tgz" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public

      - name: Confirm it landed
        if: steps.version.outputs.publish == 'true'
        run: |
          for i in $(seq 1 18); do
            npm view --prefer-online "@derive-to/cli@${{ steps.version.outputs.value }}" version && exit 0
            sleep 10
          done
          echo "published, but npm does not list it yet" >&2
          exit 1
