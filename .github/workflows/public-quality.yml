name: public surface quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ARCHITECTURE.md"
      - "DEPLOY.md"
      - "LICENSING.md"
      - "QUICKSTART.md"
      - "SECURITY.md"
      - "STANDARD.md"
      - "apps/docs/**"
      - "apps/web/e2e/public-quality/**"
      - "apps/web/public/**"
      - "apps/web/playwright.public.config.ts"
      - "apps/web/package.json"
      - "examples/**"
      - "packages/cli/README.md"
      - "packages/mcp/README.md"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "ARCHITECTURE.md"
      - "DEPLOY.md"
      - "LICENSING.md"
      - "QUICKSTART.md"
      - "SECURITY.md"
      - "STANDARD.md"
      - "apps/docs/**"
      - "apps/web/e2e/public-quality/**"
      - "apps/web/public/**"
      - "apps/web/playwright.public.config.ts"
      - "apps/web/package.json"
      - "examples/**"
      - "packages/cli/README.md"
      - "packages/mcp/README.md"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  accessibility:
    runs-on: ubicloud-standard-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter @derive/web exec playwright install --with-deps chromium

      - name: Audit production public surfaces
        run: pnpm --filter @derive/web test:e2e:public

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-public
          path: apps/web/playwright-report-public
          retention-days: 7
