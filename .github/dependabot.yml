version: 2

# HOW THIS IS TUNED, and why it is not just "grouping".
#
# The grouping below has worked for a while and is not the problem. The problem
# was volume and churn, measured on 2026-08-19:
#
#   46% of ALL CI runs came from dependabot branches
#   every open PR had re-run CI ~5 times
#   one branch had failed 9 times in a row with the SAME failure since Aug 14
#
# Two independent causes, and two independent fixes.
#
# CHURN — `rebase-strategy: disabled`. Dependabot rebases every open PR whenever
# main moves, and this repo requires branches to be up to date to merge, so every
# merge to main invalidated all of them at once. Three merges in one afternoon
# triggered ~33 CI runs, all of which re-confirmed failures already known. Nothing
# is lost by turning it off: an out-of-date branch has to be rebased before it can
# merge anyway, so the rebase now happens when someone actually intends to act
# (`@dependabot rebase`), rather than speculatively on everyone else's schedule.
#
# VOLUME — `cooldown`. A dependency is not worth a pull request the hour it ships.
# Waiting lets the ecosystem find the breakage first, and it is also the control
# that matters most against a compromised release: a malicious version is usually
# caught and yanked within days, so age is protection. This repo already applies
# that reasoning at resolution time via pnpm's `minimumReleaseAge` (24h, see
# pnpm-workspace.yaml); cooldown applies it at PR-creation time, so the two layer
# rather than duplicate.
#
# Majors get 30 days deliberately. Eight major PRs sat open for five days here,
# every one of them blocked on a real incompatibility — typescript 7 failing lint
# and coverage, @types/node 26 failing the install outright, better-sqlite3 13
# breaking the native image build. None of those were actionable on arrival, and
# opening a PR the day a major lands mostly buys a notification that the ecosystem
# is not ready yet.
updates:
  # App + package dependencies (pnpm workspace, resolved from the root lockfile).
  # Routine updates are grouped; majors stay isolated so their migrations and
  # risk are reviewed on their own evidence.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    rebase-strategy: disabled
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # TypeScript 7 is the native (Go) port, and its npm package is a different
      # artifact rather than a newer version of the old one. Its main export is
      # `{ version, versionMajorMinor }` — the JavaScript compiler API moved to
      # `typescript/unstable/*`, and the entry point these scripts need is not
      # there at all: `unstable/ast` exposes SyntaxKind, the is-predicates, a
      # factory, a scanner and a visitor, but no parser. The `createSourceFile` it
      # does export is the FACTORY (build a node from parts), not the one that
      # turns a file's text into a tree. `unstable/sync` is project-oriented
      # (parseConfigFile, updateSnapshot), so the equivalent would mean loading a
      # project rather than parsing a string.
      #
      # Four guardrails and one test parse standalone files that way:
      #   scripts/check-mutations.mjs, check-workspace-reload.mjs,
      #   check-testids.mjs, check-surfaces.mjs, apps/api/test/authz-coverage.test.ts
      #
      # Rewriting them against an API TypeScript itself labels `unstable` is not a
      # trade worth making right now, and it buys nothing on speed: `typecheck`
      # already runs on tsgo (@typescript/native-preview, pinned at a 7.0.0-dev
      # build), so this repo is on the TS7-generation compiler where it counts.
      # `typescript` is here for the compiler API and as the tsc cross-check.
      #
      # Revisit when the parser surface stabilises — drop this entry and the PR
      # comes back.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Keep the SHA-pinned GitHub Actions current (Dependabot bumps the SHA + tag
  # comment together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # Refresh digest-pinned Node bases and the runner Dockerfile without giving up
  # reproducible builds between update PRs.
  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      container-bases:
        patterns: ["*"]
    commit-message:
      prefix: "chore(images)"
