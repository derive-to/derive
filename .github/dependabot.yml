version: 2
updates:
  # App + package dependencies (pnpm workspace, resolved from the root lockfile).
  # Grouped into one PR per week so the queue stays reviewable.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # Keep the SHA-pinned GitHub Actions current (Dependabot bumps the SHA + tag
  # comment together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
