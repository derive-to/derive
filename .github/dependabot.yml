version: 2
updates:
  # App + package dependencies (pnpm workspace, resolved from the root lockfile).
  # Routine updates are grouped; majors stay isolated so their migrations and
  # risk are reviewed on their own evidence.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Keep the SHA-pinned GitHub Actions current (Dependabot bumps the SHA + tag
  # comment together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # Refresh digest-pinned Node bases and the runner Dockerfile without giving up
  # reproducible builds between update PRs.
  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
      day: monday
    groups:
      container-bases:
        patterns: ["*"]
    commit-message:
      prefix: "chore(images)"
