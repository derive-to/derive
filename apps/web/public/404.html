<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Page not found · Derive</title>
    <link rel="icon" type="image/svg+xml" href="/brand/favicon-dark.svg" />
    <style>
      @font-face {
        font-family: Geist;
        src: url("/brand/fonts/geist.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: Geist Mono;
        src: url("/brand/fonts/geist-mono.woff2") format("woff2");
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: Geist, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at 50% 28%, #262626 0, transparent 38%),
          #0a0a0a;
      }
      main {
        width: min(620px, 100%);
        text-align: center;
      }
      .mark {
        width: 42px;
        height: 56px;
        margin-bottom: 40px;
      }
      .code {
        margin: 0 0 18px;
        color: #a3a3a3;
        font: 600 12px/1 Geist Mono, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(42px, 8vw, 72px);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }
      p {
        max-width: 480px;
        margin: 24px auto 32px;
        color: #b3b3b3;
        font-size: 18px;
        line-height: 1.6;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      a {
        border: 1px solid #404040;
        border-radius: 8px;
        padding: 11px 16px;
        color: #f5f5f5;
        font: 600 13px/1 Geist Mono, monospace;
        text-decoration: none;
      }
      a:first-child {
        border-color: #f5f5f5;
        background: #f5f5f5;
        color: #0a0a0a;
      }
      a:hover,
      a:focus-visible {
        border-color: #a3a3a3;
        outline: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/brand/favicon-dark.svg" alt="" />
      <div class="code">404 · No artifact here</div>
      <h1>This URL doesn’t lead anywhere.</h1>
      <p>
        The page may have moved, the link may be incomplete, or the work may no longer be
        available.
      </p>
      <nav aria-label="Useful destinations">
        <a href="/">Go to Derive</a>
        <a href="https://docs.derive.to/">Read the docs</a>
      </nav>
    </main>
  </body>
</html>
