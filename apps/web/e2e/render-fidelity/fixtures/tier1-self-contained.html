<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tier 1 — Self-contained artifact</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --line: #262b36; --fg: #e8eaef; --mut: #8b93a5; --ac: #7c9eff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .sub { color: var(--mut); margin: 0 0 32px; font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  .card p { margin: 0; color: var(--mut); font-size: 13px; }
  .icon { width: 16px; height: 16px; flex: none; }
  button {
    background: var(--ac); color: #08101f; border: none; border-radius: 8px;
    padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  #count { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Self-contained artifact</h1>
  <p class="sub">No external stylesheets, scripts, or fonts — everything on this page is inline.</p>

  <div class="card">
    <h2>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-labelledby="hex-icon-title">
        <title id="hex-icon-title">Hexagon</title>
        <path d="M12 2 L20 7 L20 17 L12 22 L4 17 L4 7 Z" />
      </svg>
      Inline SVG icon
    </h2>
    <p>The hexagon above is drawn with an inline &lt;svg&gt;, not an external icon font.</p>
  </div>

  <div class="card">
    <h2>Inline script, interactive</h2>
    <p>Clicked <span id="count">0</span> times.</p>
    <button id="btn" type="button" data-testid="tier1-increment">Click me</button>
  </div>
</div>
<script>
  (() => {
    var n = 0;
    var countEl = document.getElementById("count");
    var btn = document.getElementById("btn");
    btn.addEventListener("click", () => {
      n += 1;
      countEl.textContent = String(n);
    });
    // A marker the test asserts on, proving the inline script actually ran
    // (not just that the markup parsed).
    document.documentElement.setAttribute("data-tier1-script-ran", "true");
  })();
</script>
</body>
</html>
