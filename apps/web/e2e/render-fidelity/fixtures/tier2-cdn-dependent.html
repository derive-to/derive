<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tier 2 — CDN-dependent artifact</title>
<style>
  body { margin: 0; background: #fff; color: #111; font-family: -apple-system, sans-serif; padding: 32px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  #status { font-size: 13px; color: #666; margin-bottom: 16px; }
  #chart-wrap { max-width: 480px; }
  canvas { border: 1px solid #ddd; }
</style>
<!-- Real external subresource from cdnjs — exactly the pattern a Claude/ChatGPT-
     exported artifact relies on. This fixture exists to PIN that Derive's serve-time
     CSP still permits it: if a future hardening pass adds a script-src/connect-src
     restriction, this script silently fails to load and the render-fidelity test
     catches it (no console error alone would — a blocked <script src> just never
     runs, it doesn't throw in the page). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
</head>
<body>
<h1>CDN-dependent artifact (Chart.js via cdnjs)</h1>
<div id="status" data-testid="tier2-status">loading…</div>
<div id="chart-wrap">
  <canvas id="chart" width="440" height="240"></canvas>
</div>
<script>
  (() => {
    var statusEl = document.getElementById("status");
    if (typeof Chart === "undefined") {
      // The CDN script never loaded/executed (blocked, network error, etc).
      statusEl.textContent = "FAILED: Chart is not defined — cdnjs script did not load";
      document.documentElement.setAttribute("data-tier2-chart-rendered", "false");
      return;
    }
    try {
      new Chart(document.getElementById("chart"), {
        type: "bar",
        data: {
          labels: ["Q1", "Q2", "Q3", "Q4"],
          datasets: [{ label: "Revenue", data: [12, 19, 8, 24], backgroundColor: "#7c9eff" }],
        },
        options: { responsive: false, animation: false },
      });
      statusEl.textContent = "OK: chart rendered";
      // The definitive success marker the test asserts on — set only AFTER the
      // Chart constructor returns without throwing, so it proves execution, not
      // just that the tag was present in the DOM.
      document.documentElement.setAttribute("data-tier2-chart-rendered", "true");
    } catch (err) {
      statusEl.textContent = `FAILED: ${err.message}`;
      document.documentElement.setAttribute("data-tier2-chart-rendered", "false");
    }
  })();
</script>
</body>
</html>
