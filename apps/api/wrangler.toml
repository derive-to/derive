# Cloudflare Workers entry for Dock (experimental edge tier: Workers + D1 + R2).
name = "dock"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "dock"
# This is Sift's prod D1 id. A D1 id is not a secret (it's inert without a
# Cloudflare API token scoped to the account), so it lives here so `pnpm run
# deploy` is one step. Self-hosting Dock? Run `wrangler d1 create dock` and put
# your own id here. See DEPLOY.md.
database_id = "63229e09-fdf4-4232-807d-1c60fabd9a39"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "dock-blobs"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ArtifactRoom"

# The webhook outbox drainer (a single named instance). Its alarm delivers queued
# webhooks with retries + backoff — the edge counterpart to the Node interval worker.
[[durable_objects.bindings]]
name = "WEBHOOK_OUTBOX"
class_name = "WebhookOutbox"

# The GitHub-sync runner (one instance per source, addressed by name). Its alarm
# mirrors a repo batch-by-batch to completion server-side, so a sync survives the
# user closing the tab — the edge counterpart to the Node detached batch-loop.
[[durable_objects.bindings]]
name = "SYNC_RUNNER"
class_name = "RepoSyncRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArtifactRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WebhookOutbox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RepoSyncRunner"]

# Notification email (Cloudflare Email Service). Left commented because the binding only
# resolves once the account has Email Service enabled and a sending domain verified — an
# unprovisioned binding fails `wrangler deploy`. The code no-ops email when SEND_EMAIL is
# unbound, so leaving this off is safe. To turn email on: enable Email Service, verify the
# dock.build sending domain, uncomment this block, and set EMAIL_FROM under [vars] (e.g.
# "Dock <notifications@dock.build>").
# [[send_email]]
# name = "SEND_EMAIL"

# Native rate limiting (per-colo). One binding per surface; the worker counts each
# rate-limited request against the matching binding (apps/api/src/worker.ts). The window
# (period) can only be 10 or 60s, so the long in-process windows (unlock 5 min, oauth
# registration 1 hr) become tighter per-minute caps here — the abuse-backstop intent
# holds, just per-colo. namespace_id is an arbitrary unique id per limiter.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "RL_PUBLISH"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_COMMENT"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 60
  period = 60

# Shared by the two tight 3/60 surfaces (unlock + oauth registration); the worker
# namespaces the key per surface so their counts stay separate.
[[ratelimits]]
name = "RL_STRICT"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 3
  period = 60

# Retry/crash backstop for webhook delivery: the outbox DO self-reschedules while busy
# and is poked on each new event, then goes idle. This wakes it every minute so a retry
# scheduled during an idle gap (or a missed poke) still drains. The leased claim makes
# this safe with the per-event pokes — no delivery fires twice.
[triggers]
crons = ["* * * * *"]

# The web SPA (apps/web) ships from this same Worker via Static Assets, so the whole
# app — login, library, settings, the /a/:ref artifact viewer — lives same-origin with
# the API (no CORS, first-party cookies). Prepare the build first:
# `pnpm --filter @dock/api build:web` (builds apps/web and preps dist/client for Workers:
# _shell.html -> index.html, drops the Pages _redirects).
# The API/data paths run the Worker first; so do /a/* and /u/* — the share + profile
# URLs, where the Worker serves the SPA shell with per-artifact / per-profile OG/unfurl
# meta injected for crawlers (it reads the shell via the ASSETS binding). Every other
# path serves a static asset,
# and non-asset routes fall back to the SPA shell (index.html) so the client router
# owns the page. The SPA is the one and only frontend (no server-rendered viewer).
[assets]
directory = "../web/dist/client"
binding = "ASSETS"
run_worker_first = ["/v1/*", "/api/*", "/raw/*", "/oauth/*", "/settings/github/*", "/a/*", "/u/*", "/healthz", "/mcp", "/.well-known/oauth-authorization-server", "/.well-known/oauth-protected-resource", "/.well-known/openid-configuration"]
not_found_handling = "single-page-application"

# baseUrl falls back to the request origin when unset. Secured by Better Auth; set
# DOCK_AUTH_SECRET via `wrangler secret put`. Cross-instance realtime fan-out uses
# the ArtifactRoom Durable Object (one room per channel).
[vars]
# DOCK_SUPERADMIN_EMAILS (operator allow-list) is optional; BASE_URL optional;
# DOCK_AUTH_SECRET is a secret (`wrangler secret put`). Workspaces are always multi.
