# Cloudflare Workers entry for Dock (experimental edge tier: Workers + D1 + R2).
# Replace database_id with your own `wrangler d1 create dock` id. See DEPLOY.md.
name = "dock"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "dock"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "dock-blobs"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ArtifactRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArtifactRoom"]

# The web SPA (apps/web) ships from this same Worker via Static Assets, so the whole
# app — login, library, settings, the /a/:ref artifact viewer — lives same-origin with
# the API (no CORS, first-party cookies). Prepare the build first:
# `pnpm --filter @dock/api build:web` (builds apps/web and preps dist/client for Workers:
# _shell.html -> index.html, drops the Pages _redirects).
# The API/data paths run the Worker first; so does /a/* — the share URL, where the
# Worker serves the SPA shell with per-artifact OG/unfurl meta injected for crawlers
# (it reads the shell via the ASSETS binding). Every other path serves a static asset,
# and non-asset routes fall back to the SPA shell (index.html) so the client router
# owns the page. The SPA is the one and only frontend (no server-rendered viewer).
[assets]
directory = "../web/dist/client"
binding = "ASSETS"
run_worker_first = ["/v1/*", "/api/*", "/raw/*", "/oauth/*", "/a/*", "/healthz"]
not_found_handling = "single-page-application"

# baseUrl falls back to the request origin when unset. Secured by Better Auth; set
# DOCK_AUTH_SECRET via `wrangler secret put`. Cross-instance realtime fan-out uses
# the ArtifactRoom Durable Object (one room per channel).
[vars]
# DOCK_SUPERADMIN_EMAILS (operator allow-list) is optional; BASE_URL optional;
# DOCK_AUTH_SECRET is a secret (`wrangler secret put`). Workspaces are always multi.
